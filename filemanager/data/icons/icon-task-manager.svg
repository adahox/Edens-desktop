<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradiente da parte de trás da pasta (Azul Vibrante) -->
    <linearGradient id="folderBackVibrant" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2196F3" />
      <stop offset="100%" stop-color="#1976D2" />
    </linearGradient>
    
    <!-- Gradiente da aba frontal da pasta (Azul Claro) -->
    <linearGradient id="folderFrontVibrant" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64B5F6" />
      <stop offset="100%" stop-color="#42A5F5" />
    </linearGradient>

    <!-- Sombra suave para dar destaque -->
    <filter id="shadowVibrant" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Ícone principal com sombra aplicada -->
  <g filter="url(#shadowVibrant)">
    <!-- Aba traseira da pasta -->
    <path d="M 80 120 L 200 120 L 240 160 L 432 160 C 454.09 160 472 177.91 472 200 L 472 400 C 472 422.09 454.09 440 432 440 L 80 440 C 57.91 440 40 422.09 40 400 L 40 160 C 40 137.91 57.91 120 80 120 Z" fill="url(#folderBackVibrant)" />
    
    <!-- Documento revelado dentro da pasta (Creme para contraste) -->
    <rect x="100" y="200" width="312" height="200" rx="8" fill="#FFFDE7" opacity="0.95" />
    <rect x="130" y="240" width="150" height="16" rx="4" fill="#3e4059" />
    <rect x="130" y="280" width="220" height="12" rx="4" fill="#a0a2b8" />
    <rect x="130" y="310" width="180" height="12" rx="4" fill="#a0a2b8" />
    
    <!-- Aba frontal da pasta -->
    <path d="M 40 220 L 472 220 L 472 410 C 472 432.09 454.09 450 432 450 L 80 450 C 57.91 450 40 432.09 40 410 Z" fill="url(#folderFrontVibrant)" />
    
    <!-- Pequeno selo circular dourado com estrela (Detalhe de destaque) -->
    <circle cx="430" cy="220" r="24" fill="#FFC107" />
    <path d="M 430 205 L 434.5 214 L 444 215.5 L 437 222 L 439 231 L 430 227 L 421 231 L 423 222 L 416 215.5 L 425.5 214 Z" fill="#FFF" />
  </g>
</svg>
